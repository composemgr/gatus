# nginx proxy address - http://172.17.0.1:8099

name: gatus
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: twinproduction/gatus:latest
    pull_policy: always
    container_name: gatus-app
    restart: always
    logging: *default-logging
    networks:
      - gatus
    ports:
      - "172.17.0.1:8099:8080"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config/gatus:/config
      - ./volumes/data/gatus:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gatus:
    name: gatus
    external: false
